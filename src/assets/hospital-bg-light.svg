<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="floorL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="lightL" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgL)"/>

  <!-- ceiling light beams -->
  <rect x="120" y="0" width="180" height="700" fill="url(#lightL)" opacity="0.7"/>
  <rect x="640" y="0" width="200" height="720" fill="url(#lightL)" opacity="0.8"/>
  <rect x="1180" y="0" width="200" height="700" fill="url(#lightL)" opacity="0.7"/>

  <!-- ceiling panels -->
  <g opacity="0.4">
    <rect x="60" y="0" width="300" height="36" fill="#bfdbfe"/>
    <rect x="580" y="0" width="320" height="36" fill="#bfdbfe"/>
    <rect x="1120" y="0" width="320" height="36" fill="#bfdbfe"/>
    <rect x="80" y="40" width="80" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="260" y="40" width="80" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="600" y="40" width="80" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="800" y="40" width="80" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="1140" y="40" width="80" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="1340" y="40" width="80" height="12" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- back wall -->
  <rect x="0" y="60" width="1600" height="640" fill="url(#wallL)"/>
  <rect x="0" y="680" width="1600" height="6" fill="#3b82f6" opacity="0.2"/>

  <!-- floor -->
  <polygon points="0,700 1600,700 1600,1000 0,1000" fill="url(#floorL)"/>
  <g stroke="#bae6fd" stroke-width="1" opacity="0.5">
    <line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="0" y1="870" x2="1600" y2="870"/>
    <line x1="0" y1="960" x2="1600" y2="960"/>
    <line x1="200" y1="700" x2="-100" y2="1000"/>
    <line x1="500" y1="700" x2="300" y2="1000"/>
    <line x1="800" y1="700" x2="800" y2="1000"/>
    <line x1="1100" y1="700" x2="1300" y2="1000"/>
    <line x1="1400" y1="700" x2="1700" y2="1000"/>
  </g>

  <!-- left: medical monitor -->
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="240" height="150" rx="10" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <rect x="10" y="10" width="220" height="130" rx="4" fill="url(#screenL)"/>
    <polyline points="20,85 55,85 68,50 82,115 96,35 110,85 145,85 158,62 172,85 220,85"
      fill="none" stroke="#059669" stroke-width="2.5" opacity="0.85"/>
    <rect x="20" y="110" width="70" height="7" rx="2" fill="#3b82f6" opacity="0.5"/>
    <rect x="20" y="124" width="45" height="6" rx="2" fill="#06b6d4" opacity="0.5"/>
  </g>

  <!-- center: reception + cross -->
  <g transform="translate(700,440)">
    <rect x="-120" y="60" width="240" height="120" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="-120" y="55" width="240" height="14" rx="4" fill="#3b82f6" opacity="0.25"/>
    <g transform="translate(0,-30)">
      <rect x="-13" y="-38" width="26" height="76" rx="6" fill="#10b981" opacity="0.8"/>
      <rect x="-38" y="-13" width="76" height="26" rx="6" fill="#10b981" opacity="0.8"/>
      <rect x="-13" y="-38" width="26" height="76" rx="6" fill="#3b82f6" opacity="0.3"/>
      <rect x="-38" y="-13" width="76" height="26" rx="6" fill="#3b82f6" opacity="0.3"/>
    </g>
  </g>

  <!-- right: door / corridor -->
  <g transform="translate(1180,200)">
    <rect x="0" y="0" width="220" height="480" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="14" y="14" width="192" height="452" rx="4" fill="#eff6ff"/>
    <rect x="90" y="230" width="40" height="20" rx="3" fill="#3b82f6" opacity="0.35"/>
    <rect x="14" y="14" width="192" height="452" rx="4" fill="url(#lightL)" opacity="0.4"/>
  </g>

  <!-- left: corridor opening -->
  <g transform="translate(60,220)">
    <rect x="0" y="0" width="180" height="460" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="12" y="12" width="156" height="436" rx="4" fill="#eff6ff"/>
    <rect x="12" y="12" width="156" height="436" rx="4" fill="url(#lightL)" opacity="0.35"/>
  </g>

  <!-- soft particles -->
  <g fill="#3b82f6" opacity="0.2">
    <circle cx="350" cy="300" r="2"/>
    <circle cx="520" cy="220" r="1.5"/>
    <circle cx="980" cy="320" r="2"/>
    <circle cx="1080" cy="200" r="1.5"/>
    <circle cx="400" cy="520" r="1.5"/>
    <circle cx="1320" cy="560" r="2"/>
  </g>

</svg>
