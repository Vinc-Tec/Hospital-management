<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.45" stop-color="#0c1a3a"/>
      <stop offset="0.7" stop-color="#0d2442"/>
      <stop offset="1" stop-color="#0f2d1e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0f1e30" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="light" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- ceiling light beams -->
  <rect x="120" y="0" width="180" height="700" fill="url(#light)" opacity="0.5"/>
  <rect x="640" y="0" width="200" height="720" fill="url(#light)" opacity="0.6"/>
  <rect x="1180" y="0" width="200" height="700" fill="url(#light)" opacity="0.5"/>

  <!-- ceiling panels -->
  <g opacity="0.35">
    <rect x="60" y="0" width="300" height="40" fill="#0c1a3a"/>
    <rect x="580" y="0" width="320" height="40" fill="#0c1a3a"/>
    <rect x="1120" y="0" width="320" height="40" fill="#0c1a3a"/>
    <rect x="80" y="44" width="80" height="14" rx="3" fill="#bae6fd" opacity="0.5"/>
    <rect x="260" y="44" width="80" height="14" rx="3" fill="#bae6fd" opacity="0.5"/>
    <rect x="600" y="44" width="80" height="14" rx="3" fill="#bae6fd" opacity="0.5"/>
    <rect x="800" y="44" width="80" height="14" rx="3" fill="#bae6fd" opacity="0.5"/>
    <rect x="1140" y="44" width="80" height="14" rx="3" fill="#bae6fd" opacity="0.5"/>
    <rect x="1340" y="44" width="80" height="14" rx="3" fill="#bae6fd" opacity="0.5"/>
  </g>

  <!-- back wall -->
  <rect x="0" y="60" width="1600" height="640" fill="url(#wall)"/>

  <!-- wall accent line -->
  <rect x="0" y="680" width="1600" height="6" fill="#0ea5e9" opacity="0.25"/>

  <!-- floor with perspective -->
  <polygon points="0,700 1600,700 1600,1000 0,1000" fill="url(#floor)"/>
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="780" x2="1600" y2="780"/>
    <line x1="0" y1="870" x2="1600" y2="870"/>
    <line x1="0" y1="960" x2="1600" y2="960"/>
    <line x1="200" y1="700" x2="-100" y2="1000"/>
    <line x1="500" y1="700" x2="300" y2="1000"/>
    <line x1="800" y1="700" x2="800" y2="1000"/>
    <line x1="1100" y1="700" x2="1300" y2="1000"/>
    <line x1="1400" y1="700" x2="1700" y2="1000"/>
  </g>

  <!-- left: medical monitor screen -->
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="260" height="170" rx="10" fill="#050a12" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="10" y="10" width="240" height="150" rx="4" fill="url(#screen)"/>
    <!-- heartbeat line -->
    <polyline points="20,95 60,95 75,55 90,130 105,40 120,95 160,95 175,70 190,95 240,95"
      fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.9"/>
    <rect x="20" y="125" width="80" height="8" rx="2" fill="#0ea5e9" opacity="0.6"/>
    <rect x="20" y="140" width="50" height="6" rx="2" fill="#67e8f9" opacity="0.5"/>
  </g>

  <!-- center: reception desk + cross -->
  <g transform="translate(700,440)">
    <rect x="-120" y="60" width="240" height="120" rx="8" fill="#0c1a3a" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="-120" y="55" width="240" height="14" rx="4" fill="#0ea5e9" opacity="0.3"/>
    <!-- glowing medical cross on wall -->
    <g transform="translate(0,-30)">
      <rect x="-14" y="-40" width="28" height="80" rx="6" fill="#10b981" opacity="0.85"/>
      <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#10b981" opacity="0.85"/>
      <rect x="-14" y="-40" width="28" height="80" rx="6" fill="#0ea5e9" opacity="0.4"/>
      <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#0ea5e9" opacity="0.4"/>
    </g>
  </g>

  <!-- right: door / corridor -->
  <g transform="translate(1180,200)">
    <rect x="0" y="0" width="220" height="480" rx="6" fill="#0a1424" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="14" y="14" width="192" height="452" rx="4" fill="#0c1a3a"/>
    <rect x="90" y="230" width="40" height="20" rx="3" fill="#0ea5e9" opacity="0.4"/>
    <!-- corridor glow -->
    <rect x="14" y="14" width="192" height="452" rx="4" fill="url(#light)" opacity="0.3"/>
  </g>

  <!-- left: corridor opening -->
  <g transform="translate(60,220)">
    <rect x="0" y="0" width="180" height="460" rx="6" fill="#0a1424" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="12" y="12" width="156" height="436" rx="4" fill="#0c1a3a"/>
    <rect x="12" y="12" width="156" height="436" rx="4" fill="url(#light)" opacity="0.25"/>
  </g>

  <!-- subtle floating particles -->
  <g fill="#bae6fd" opacity="0.25">
    <circle cx="350" cy="300" r="2"/>
    <circle cx="520" cy="220" r="1.5"/>
    <circle cx="980" cy="320" r="2"/>
    <circle cx="1080" cy="200" r="1.5"/>
    <circle cx="400" cy="520" r="1.5"/>
    <circle cx="1320" cy="560" r="2"/>
  </g>

  <!-- dark overlay for text readability -->
  <rect width="1600" height="1000" fill="#0f172a" opacity="0.55"/>
</svg>
